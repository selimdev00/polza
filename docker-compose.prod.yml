services:
  db:
    image: postgres:16-alpine
    container_name: polza-prod-db
    environment:
      POSTGRES_USER: polza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: polza
    # Порт наружу не публикуется: база нужна только приложению
    # в этой же сети compose.
    volumes:
      - polza-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polza -d polza"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    container_name: polza-app
    environment:
      DATABASE_URL: postgresql://polza:${POSTGRES_PASSWORD}@db:5432/polza
    ports:
      - "127.0.0.1:3971:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  polza-prod-pgdata:
